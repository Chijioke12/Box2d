name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-ubuntu:
    name: ubuntu

    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
          sudo apt update
          sudo apt install libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ./bin/unit_test
      
    - name: Upload Linux Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: box2d-linux
        path: |
          ${{github.workspace}}/build/bin
          ${{github.workspace}}/build/src/libbox2d.a
        if-no-files-found: ignore

  build-macos:
    name: macos
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ./bin/unit_test

    - name: Upload macOS Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: box2d-macos
        path: |
          ${{github.workspace}}/build/bin
          ${{github.workspace}}/build/src/libbox2d.a
        if-no-files-found: ignore

  build-windows:
    name: windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ./bin/${{env.BUILD_TYPE}}/unit_test

    - name: Upload Windows Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: box2d-windows
        path: |
          ${{github.workspace}}/build/bin
          ${{github.workspace}}/build/src/${{env.BUILD_TYPE}}/box2d.lib
        if-no-files-found: ignore

  build-asmjs:
    name: asmjs (emscripten)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.50

    - name: Verify Emscripten Version
      run: emcc -v

    - name: Configure CMake for asm.js
      run: |
        emcmake cmake -B ${{github.workspace}}/build-asmjs \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DBOX2D_BUILD_WASM=OFF \
          -DBOX2D_BUILD_UNIT_TESTS=OFF \
          -DBOX2D_BUILD_TESTBED=OFF \
          -DBOX2D_BUILD_DOCS=OFF \
          -DCMAKE_CXX_FLAGS="-O3 -s WASM=0 -s LEGACY_VM_SUPPORT=1"

    - name: Build asm.js
      run: cmake --build ${{github.workspace}}/build-asmjs --config ${{env.BUILD_TYPE}}

    - name: Upload asm.js Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: box2d-asmjs
        path: |
          ${{github.workspace}}/build-asmjs/bin
          ${{github.workspace}}/build-asmjs/src/libbox2d.a
          ${{github.workspace}}/build-asmjs/src/*.js
        if-no-files-found: warn

      